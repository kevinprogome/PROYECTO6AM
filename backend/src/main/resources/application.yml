# Proyecto: GreenHouse Manager
# Archivo: application.yml
# Descripcion: Configuracion principal con perfiles dev y prod.
# Autor: Equipo GreenHouse Manager
# Fecha: 2026-05-02
# Version: 1.0.0

spring:
  application:
    name: greenhouse-manager
  profiles:
    active: dev
  messages:
    basename: messages
    encoding: UTF-8
  jackson:
    time-zone: America/Bogota

security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-32-characters-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/login}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Perfil: dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/greenhouse?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:489238176370-dsjn3ih6bpp4205kouta6dhgi2c03nif.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: ${DEV_MAIL_HOST:smtp.mailtrap.io}
    port: ${DEV_MAIL_PORT:2525}
    username: ${DEV_MAIL_USER:}
    password: ${DEV_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Perfil: prod
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: ${PROD_MAIL_HOST}
    port: ${PROD_MAIL_PORT:587}
    username: ${PROD_MAIL_USER}
    password: ${PROD_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN